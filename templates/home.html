
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Students</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg, #141e30, #243b55, #6a11cb
            );
            overflow: hidden;
        }

        .greeting-card {
            width: 85%;
            max-width: 750px;
            padding: 60px 30px;
            text-align: center;
            color: white;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            animation: appear 1.2s ease-out;
        }

        .emoji {
            font-size: 65px;
            margin-bottom: 20px;
            animation: wave 2s infinite;
        }

        h1 {
            font-size: clamp(2.3rem, 6vw, 4rem);
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(
                90deg, #ffe259, #ffa751, #ff6ec4
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #7df9ff;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(125, 249, 255, 0.6);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #f1f5f9;
            margin-bottom: 30px;
        }

        .welcome-btn {
            display: inline-block;
            padding: 15px 35px;
            border-radius: 50px;
            background: linear-gradient(90deg, #ff6ec4, #7873f5);
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(120, 115, 245, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .welcome-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 30px rgba(255, 110, 196, 0.5);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #dbeafe;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-12deg); }
            75% { transform: rotate(12deg); }
        }

        @media (max-width: 480px) {
            .greeting-card {
                padding: 40px 20px;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="greeting-card">
        <div class="emoji">👋</div>

        <h1>Hello Students!</h1>

        <h2>☀️ Good Afternoon! ☀️</h2>

        <p>
            Welcome to an exciting learning session!<br>
            Keep learning, keep growing, and keep shining.
            Your future starts with what you learn today!
        </p>

        <button class="welcome-btn"
                onclick="alert('Welcome, Students! Let us learn something amazing today! 🎓')">
            Let's Start Learning 🚀
        </button>

        <div class="footer">
            ✨ Learn Today • Lead Tomorrow ✨
        </div>
    </div>

</body>
</html>
